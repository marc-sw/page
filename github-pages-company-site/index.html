<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcsw – Landingpage</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 0; background:#f0f2f5; color:#333; }
    header { background:#2874f0; color:#fff; padding:2rem; text-align:center; }
    header h1 { margin:0; font-weight:700; }
    .container { max-width: 1200px; margin: auto; padding: 2rem; }
    .hero { text-align:center; margin:2rem 0; }
    .hero img { max-width: 80%; height:auto; margin:1rem 0; }
    .tagline { font-size:1.2rem; margin-bottom:2rem; }
    .features { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:1rem; }
    .feature { background:#fff; padding:1rem; border-radius:8px; text-align:center; }
    footer { text-align:center; padding:1rem; background:#1a0f34; color:#aaa; margin-top:2rem; }
  </style>
</head>
<body>

<header>
  <h1>Marcsw</h1>
</header>

<div class="container">
  <section class="hero">
    <h2>Willkommen bei Marcsw</h2>
    <p>Qwixx spielen alleine oder mit Freunden und Familie.</p>
    <img src="./image/qwixx_splash.png" alt="Marcsw App" width="400">
  </section>

  <section class="features">
    <div class="feature">
      <h3>Einfach</h3>
      <p>Nutze die App in wenigen Schritten.</p>
    </div>
    <div class="feature">
      <h3>Schnell</h3>
      <p>Sofortiger Zugriff auf alle Funktionen.</p>
    </div>
    <div class="feature">
      <h3>Sicher</h3>
      <p>Deine Daten sind geschützt.</p>
    </div>
  </section>
</div>

<footer>
  &copy; 2026 Marcsw. Alle Rechte vorbehalten.
</footer>

</body>
</html>
